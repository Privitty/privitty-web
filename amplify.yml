version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        - node ./scripts/write-amplify-env.mjs
        - npm run build
        - mkdir -p .next/prisma-engines .next/node_modules/.prisma/client
        - cp -f node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node .next/prisma-engines/
        - cp -f node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node .next/node_modules/.prisma/client/
        - cp -f node_modules/.prisma/client/schema.prisma .next/node_modules/.prisma/client/
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
